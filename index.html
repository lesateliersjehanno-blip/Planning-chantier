// ══════════════════════════════════════════════════════════════
// ── PLANNING ATELIER (onglet « Atelier ») — vue par SEMAINE ──
// Firebase : planning/v1/atelier/
//   centres   : [{id,label,ci}]                 ci = index couleur PALETTE
//   semaines  : {"<centreId>_<lundi AAAA-MM-JJ>": [{c:"chantier",t:"tâches",s:"AAAA-MM-JJ"}]}
//                                               s = date de sortie d'atelier
//   chantiers : ["Nom", …]                      catalogue pour l'autocomplétion
// Chaque case (centre × semaine) est sauvegardée individuellement.
// Centres masqués : préférence locale à l'appareil (comme les filtres pôles).
// ══════════════════════════════════════════════════════════════
const AR=B+"/atelier";
const ATL_CACHE='jehanno_atelier_cache',ATL_PREF='jehanno_atelier_prefs',TAB_KEY='jehanno_tab';
const ATL_DEFAULT=[{id:'bois',label:'Atelier bois',ci:3},{id:'fenetres',label:'Atelier fenêtres',ci:0},{id:'alu',label:'Atelier alu',ci:7}];
let atlCentres=ATL_DEFAULT.map(c=>({...c}));
let atlWk={},atlChantiers=[],atlHidden=new Set();
let atlWeeks=4,atlStart=atlMonday(new Date());
let atlPop=null,atlEdId=null,atlColor=0,curTab='pose';

function atlMonday(d){const x=new Date(d);x.setHours(0,0,0,0);const dw=x.getDay()||7;x.setDate(x.getDate()-(dw-1));return x;}
function atlYmd(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function atlParse(k){const p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function atlList(v){return Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);}
function atlNorm(v){return atlList(v).filter(e=>e&&(e.c||e.t||e.s)).map(e=>({c:String(e.c||'').trim(),t:String(e.t||'').trim(),s:/^\d{4}-\d{2}-\d{2}$/.test(e.s||'')?e.s:'',d:!!e.d,h:String(e.h==null?'':e.h).trim()}));}
// Prévisionnel d'heures : « 12 », « 7,5 », « 3h30 » → nombre d'heures (NaN si illisible)
function atlH(v){v=String(v||'').trim().toLowerCase().replace(',','.');if(!v)return NaN;let m=/^(\d+(?:\.\d+)?)\s*h?\s*(\d{1,2})?\s*(?:min)?$/.exec(v);if(!m)return NaN;return parseFloat(m[1])+(m[2]?parseInt(m[2],10)/60:0);}
const atlHfmt=n=>(Math.round(n*100)/100).toString().replace('.',',')+' h';
function atlNormCentres(v){return atlList(v).filter(c=>c&&c.id).map(c=>({id:String(c.id).replace(/[^\w-]/g,''),label:String(c.label||'Centre'),ci:Number.isInteger(c.ci)?c.ci:0})).filter(c=>c.id);}
function atlPal(c){return PALETTE[((c&&c.ci)||0)%PALETTE.length];}
function atlChipCol(n){return letterColor(n)||{bg:'#E4E4E7',tx:'#333'};}
const atlFmt=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const atlFmtS=k=>{const d=atlParse(k);return d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
const atlVisible=()=>atlCentres.filter(c=>!atlHidden.has(c.id));

// ── Cache local + préférences d'affichage ──
function atlSaveCache(){try{localStorage.setItem(ATL_CACHE,JSON.stringify({centres:atlCentres,semaines:atlWk,chantiers:atlChantiers}));}catch(e){}}
function atlLoadCache(){
  try{
    const d=JSON.parse(localStorage.getItem(ATL_CACHE)||'null');if(!d)return;
    const c=atlNormCentres(d.centres);if(c.length)atlCentres=c;
    if(d.semaines&&typeof d.semaines==='object')atlWk=d.semaines;
    atlChantiers=atlList(d.chantiers).filter(x=>typeof x==='string');
  }catch(e){}
}
function atlSavePref(){try{localStorage.setItem(ATL_PREF,JSON.stringify({weeks:atlWeeks,hidden:[...atlHidden]}));}catch(e){}}
function atlLoadPref(){try{const p=JSON.parse(localStorage.getItem(ATL_PREF)||'null');if(p){if([1,2,4,6].includes(p.weeks))atlWeeks=p.weeks;if(Array.isArray(p.hidden))atlHidden=new Set(p.hidden);}}catch(e){}}

// ── Sync Firebase ──
async function atlSet(path,val){
  atlSaveCache();ss('syncing');
  try{await set(ref(db,AR+path),val);ss('ok');}
  catch(e){ss('err');toast('Hors ligne : sauvegardé sur l\'appareil, sync au retour du réseau');}
}
function atlSvCentres(){return atlSet('/centres',JSON.parse(JSON.stringify(atlCentres)));}
function atlSvCell(k){const l=atlWk[k];return atlSet('/semaines/'+k,l&&l.length?l:null);}
// Écrit plusieurs cases d'un coup (update multi-chemins) : évite que l'écho Firebase
// de la 1re écriture n'écrase atlWk avant l'écriture de la semaine de destination.
async function atlSvCells(keys){
  const o={};keys.forEach(k=>{const l=atlWk[k];o[k]=l&&l.length?JSON.parse(JSON.stringify(l)):null;});
  atlSaveCache();ss('syncing');
  try{await update(ref(db,AR+'/semaines'),o);ss('ok');}
  catch(e){ss('err');toast('Hors ligne : sauvegardé sur l\'appareil, sync au retour du réseau');}
}
function atlSvCh(){return atlSet('/chantiers',atlChantiers.length?atlChantiers:null);}
function atlRefresh(){keepScroll(()=>{atlBuildChips();if(curTab==='atelier')atlRender();});}
onValue(ref(db,AR+'/centres'),s=>{const c=atlNormCentres(s.val());if(c.length)atlCentres=c;else atlSvCentres();atlSaveCache();atlRefresh();});
onValue(ref(db,AR+'/semaines'),s=>{atlWk=s.val()||{};atlSaveCache();atlRefresh();});
onValue(ref(db,AR+'/chantiers'),s=>{atlChantiers=atlList(s.val()).filter(x=>typeof x==='string');atlSaveCache();});

// ── Filtre des centres (chips) ──
function atlBuildChips(){
  const el=document.getElementById('atl-chips');if(!el)return;
  const allOn=!atlCentres.some(c=>atlHidden.has(c.id));
  el.innerHTML=`<span class="atl-fchip all${allOn?'':' off'}" onclick="atlShowAll()">Tous</span>`+
    atlCentres.map(c=>{const p=atlPal(c);return `<span class="atl-fchip${atlHidden.has(c.id)?' off':''}" style="background:${p.tBg};color:${p.text};border-color:${p.bg}" onclick="atlToggleCentre('${c.id}')"><i class="ti ti-tools"></i> ${esc(c.label)}</span>`;}).join('');
}
window.atlToggleCentre=id=>{
  if(atlHidden.has(id))atlHidden.delete(id);
  else{if(atlVisible().length<=1){toast('Au moins un centre doit rester affiché');return;}atlHidden.add(id);}
  atlSavePref();atlBuildChips();atlRender();
};
window.atlShowAll=()=>{atlHidden.clear();atlSavePref();atlBuildChips();atlRender();};

// ── Rendu : lignes = centres, colonnes = semaines ──
function atlMondays(){const r=[];for(let w=0;w<atlWeeks;w++){const d=new Date(atlStart);d.setDate(d.getDate()+w*7);r.push(d);}return r;}
function atlTot(l){const hs=l.map(e=>atlH(e.h)).filter(n=>!isNaN(n));if(!hs.length)return '';const t=hs.reduce((a,b)=>a+b,0),r=l.filter(e=>e.d).map(e=>atlH(e.h)).filter(n=>!isNaN(n)).reduce((a,b)=>a+b,0);return `<div class="atl-tot">Total prév. : <b>${atlHfmt(t)}</b>${r?` · réalisé ${atlHfmt(r)}`:''}</div>`;}
function atlMini(l,k){
  return `<div class="atl-wt">${l.map((e,i)=>{const col=atlChipCol(e.c);
    const dn=e.d?' done':'';
    return `<div class="c${dn} atl-drag" draggable="true" ondragstart="atlDragStart(event,'${k}',${i})" ondragend="atlDragEnd()" title="Glisser pour déplacer vers une autre semaine" style="${e.d?'':`background:${col.bg};color:${col.tx}`}">${e.d?'✓ ':''}${esc(e.c)||'—'}</div><div class="t${dn}">${esc(e.t)}</div><div class="h${dn}">prév.<b>${e.h?esc(isNaN(atlH(e.h))?e.h:atlHfmt(atlH(e.h))):'—'}</b></div><div class="s${dn} atl-spk" onclick="atlSortiePick(event,'${k}',${i})" title="Modifier la sortie d'atelier">${e.d?'réalisé · ':''}sortie d'atelier le :<b>${e.s?atlFmtS(e.s):'&nbsp;'}</b></div>`;}).join('')}</div>${atlTot(l)}`;
}
function atlRender(){
  const tb=document.getElementById('atl-table');if(!tb)return;
  const mons=atlMondays(),curMon=atlYmd(atlMonday(new Date())),vis=atlVisible();
  tb.classList.toggle('one',atlWeeks===1);tb.classList.toggle('w2',atlWeeks===2);tb.classList.toggle('w4',atlWeeks===4);
  let h='<thead><tr><th class="atl-corner">Centres</th>';
  mons.forEach(m=>{const f=new Date(m);f.setDate(f.getDate()+4);
    h+=`<th class="${atlYmd(m)===curMon?'cur':''}">Semaine ${wkNum(m)} <span>/ du ${m.getDate()}${m.getMonth()!==f.getMonth()?' '+m.toLocaleDateString('fr-FR',{month:'short'}):''} au ${f.getDate()} ${f.toLocaleDateString('fr-FR',{month:'long'})}</span></th>`;});
  h+='</tr></thead><tbody>';
  if(!vis.length)h+=`<tr class="atl-empty"><td colspan="${mons.length+1}">Aucun centre — <button class="btn" onclick="atlCentreOpen(null)"><i class="ti ti-plus"></i> Ajouter un centre</button></td></tr>`;
  vis.forEach(c=>{
    const pl=atlPal(c),names=new Set();let row='';
    mons.forEach(m=>{
      const mk=atlYmd(m),l=atlNorm(atlWk[c.id+'_'+mk]);
      l.forEach(e=>{if(e.c)names.add(e.c.toLowerCase());});
      const cl=['atl-cell'];if(mk===curMon)cl.push('cur');if(!l.length)cl.push('empty');
      row+=`<td class="${cl.join(' ')}" onclick="atlOpen('${c.id}','${mk}')" ondragover="atlDragOver(event)" ondragleave="this.classList.remove('drop')" ondrop="atlDrop(event,'${c.id}','${mk}')">${l.length?atlMini(l,c.id+'_'+mk):''}<div class="atl-add-hint"><i class="ti ti-plus"></i></div></td>`;
    });
    h+=`<tr><td class="atl-centre" style="border-left-color:${pl.bg}" onclick="atlCentreOpen('${c.id}')" title="Modifier le centre"><div class="atl-cname" style="background:${pl.tBg};color:${pl.text}"><i class="ti ti-tools"></i><span>${esc(c.label)}</span></div><div class="atl-ccount">${names.size} chantier${names.size>1?'s':''} sur la période</div></td>${row}</tr>`;
  });
  tb.innerHTML=h+'</tbody>';
  const a=mons[0],b=mons[mons.length-1];
  document.getElementById('atl-lbl').textContent=atlWeeks===1?`S${wkNum(a)} · ${atlFmt(a)}`:`S${wkNum(a)} → S${wkNum(b)}`;
  document.querySelectorAll('#atl-toolbar [data-w]').forEach(x=>x.classList.toggle('on',+x.dataset.w===atlWeeks));
}

// ── Glisser-déposer d'un chantier vers une autre case (semaine / centre) ──
let atlDrag=null;
window.atlDragStart=(ev,k,i)=>{
  atlDrag={k,i};ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',k+'#'+i);}catch(e){}
  ev.stopPropagation();document.body.classList.add('atl-dragging');atlSpickClose();
};
window.atlDragEnd=()=>{document.body.classList.remove('atl-dragging');document.querySelectorAll('#atl-table td.drop').forEach(t=>t.classList.remove('drop'));};
window.atlDragOver=ev=>{if(!atlDrag)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('drop');};
window.atlDrop=(ev,cid,mk)=>{
  ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('drop');
  const d=atlDrag;atlDrag=null;atlDragEnd();if(!d)return;
  const kk=cid+'_'+mk;if(kk===d.k)return;
  const src=atlNorm(atlWk[d.k]),e=src[d.i];if(!e)return;
  src.splice(d.i,1);
  // la date de sortie n'est gardée que si elle tombe dans la semaine d'arrivée
  const m=atlParse(mk),f=new Date(m);f.setDate(f.getDate()+4);
  if(e.s){const sd=atlParse(e.s);if(sd<m||sd>f)e.s='';}
  const dst=atlNorm(atlWk[kk]);dst.push(e);
  if(src.length)atlWk[d.k]=src;else delete atlWk[d.k];
  atlWk[kk]=dst;atlSvCells([d.k,kk]);atlRender();
  toast(`${e.c||'Chantier'} → S${wkNum(m)} ✓`);
  // petite fenêtre pour choisir la sortie d'atelier dans la nouvelle semaine
  atlSortiePick({clientX:ev.clientX,clientY:ev.clientY,stopPropagation(){}},kk,dst.length-1,true);
};
// ── Choix rapide de la sortie d'atelier (jours de la semaine de la case) ──
window.atlSortiePick=(ev,k,i,afterDrop)=>{
  ev.stopPropagation();
  const l=atlNorm(atlWk[k]),e=l[i];if(!e)return;
  const mk=k.slice(k.lastIndexOf('_')+1),m=atlParse(mk);
  const p=document.getElementById('atl-spick');
  let h=`<div class="atl-sp-h"><i class="ti ti-calendar-event"></i> ${afterDrop?'Déplacé en S'+wkNum(m)+' — ':''}Sortie d'atelier<br><small>${esc(e.c||'Chantier')}</small></div><div class="atl-sp-days">`;
  for(let j=0;j<5;j++){const d=new Date(m);d.setDate(d.getDate()+j);const dk=atlYmd(d);
    h+=`<button class="${e.s===dk?'on':''}${isFerie(d)?' fe':''}" onclick="atlSortieSet('${k}',${i},'${dk}')">${['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][d.getDay()]}<b>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</b></button>`;}
  h+=`</div><div class="atl-sp-f"><button onclick="atlSortieSet('${k}',${i},'')">Effacer</button><button onclick="atlSpickClose()">Fermer</button></div>`;
  p.innerHTML=h;p.classList.add('open');
  const w=p.offsetWidth,hh=p.offsetHeight;
  p.style.left=Math.max(8,Math.min(ev.clientX-w/2,window.innerWidth-w-8))+'px';
  p.style.top=Math.max(8,Math.min(ev.clientY+12,window.innerHeight-hh-8))+'px';
};
window.atlSortieSet=(k,i,dk)=>{
  const l=atlNorm(atlWk[k]);if(!l[i])return;
  l[i].s=dk;atlWk[k]=l;atlSvCells([k]);atlSpickClose();atlRender();
  toast(dk?`Sortie d'atelier : ${atlFmtS(dk)} ✓`:'Sortie d\'atelier effacée');
};
function atlSpickClose(){const p=document.getElementById('atl-spick');if(p)p.classList.remove('open');}
document.addEventListener('click',e=>{if(!e.target.closest('#atl-spick'))atlSpickClose();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')atlSpickClose();});

// ── Navigation ──
window.atlShift=n=>{atlStart.setDate(atlStart.getDate()+7*n);atlRender();};
window.atlToday=()=>{atlStart=atlMonday(new Date());atlRender();};
window.atlSetWeeks=n=>{atlWeeks=n;atlSavePref();atlRender();};

// ── Popup d'une semaine (plusieurs chantiers) ──
function atlFillDL(){
  const m=new Map();
  atlChantiers.forEach(n=>{if(n)m.set(n.toLowerCase(),n);});
  Object.values(atlWk).forEach(v=>atlNorm(v).forEach(e=>{if(e.c&&!m.has(e.c.toLowerCase()))m.set(e.c.toLowerCase(),e.c);}));
  document.getElementById('atl-dl').innerHTML=[...m.values()].sort((a,b)=>a.localeCompare(b,'fr')).map(n=>`<option value="${esc(n)}"></option>`).join('');
}
function atlRow(e,focus){
  const r=document.createElement('div');r.className='atl-row';
  r.innerHTML=`<span class="atl-dot"></span><input type="text" class="atl-in-c" list="atl-dl" maxlength="40" placeholder="Chantier…" autocomplete="off"><textarea class="atl-in-t" rows="1" maxlength="400" placeholder="Tâches (une par ligne)"></textarea><input type="text" class="atl-in-h" maxlength="8" inputmode="decimal" placeholder="Prév. h" title="Prévisionnel d'heures (ex : 12 ou 3h30)"><select class="atl-in-s" title="Sortie d'atelier le">${atlDayOpts(e&&e.s)}</select><select class="atl-in-w" title="Déplacer ce chantier vers une autre semaine">${atlWeekOpts()}</select><label class="atl-dn" title="Travail réalisé"><input type="checkbox" class="atl-in-d"></label><button type="button" class="atl-rm" title="Supprimer ce chantier"><i class="ti ti-trash"></i></button>`;
  const ic=r.querySelector('.atl-in-c'),it=r.querySelector('.atl-in-t'),is=r.querySelector('.atl-in-s'),dot=r.querySelector('.atl-dot');
  ic.value=(e&&e.c)||'';it.value=(e&&e.t)||'';is.value=(e&&e.s)||'';r.querySelector('.atl-in-h').value=(e&&e.h)||'';
  const upd=()=>{const col=letterColor(ic.value);dot.style.background=col?col.bg:'';};upd();
  const grow=()=>{it.style.height='auto';it.style.height=Math.max(34,it.scrollHeight+2)+'px';};
  ic.addEventListener('input',upd);it.addEventListener('input',grow);
  const iw=r.querySelector('.atl-in-w');const idn=r.querySelector('.atl-in-d');idn.checked=!!(e&&e.d);r.classList.toggle('done',idn.checked);
  idn.addEventListener('change',()=>r.classList.toggle('done',idn.checked));
  // Déplacement : la liste « sortie » propose les jours de la semaine de destination
  iw.addEventListener('change',()=>{const off=parseInt(iw.value,10)||0;iw.classList.toggle('moved',off!==0);
    is.innerHTML=atlDayOpts(off?'':((e&&e.s)||''),off);is.classList.toggle('moved',off!==0);});
  ic.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();it.focus();}});

// Options « Sortie d'atelier le » : jours de la semaine ouverte (lun → ven), sans calendrier
function atlDayOpts(cur,off){
  const base=atlParse(atlPop?atlPop.mk:atlYmd(atlStart));base.setDate(base.getDate()+7*(off||0));let o='<option value="">—</option>',found=!cur;
  for(let i=0;i<5;i++){const d=new Date(base);d.setDate(d.getDate()+i);const k=atlYmd(d);if(k===cur)found=true;
    o+=`<option value="${k}"${k===cur?' selected':''}>${['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}${isFerie(d)?' (férié)':''}</option>`;}
  if(!found)o+=`<option value="${cur}" selected>${atlFmtS(cur)}</option>`;
  return o;
}
// Options « Semaine » d'une ligne : décalage de -4 à +12 semaines par rapport à la semaine ouverte
function atlWeekOpts(){
  const base=atlParse(atlPop?atlPop.mk:atlYmd(atlStart));let o='';
  for(let i=-4;i<=12;i++){const m=new Date(base);m.setDate(m.getDate()+7*i);
    o+=`<option value="${i}"${i===0?' selected':''}>S${wkNum(m)}${i===0?' (actuelle)':' · '+String(m.getDate()).padStart(2,'0')+'/'+String(m.getMonth()+1).padStart(2,'0')}</option>`;}
  return o;
}

window.atlSave=()=>{
  if(!atlPop)return;
  const {cid,mk}=atlPop,k=cid+'_'+mk;
  const all=[...document.querySelectorAll('#atl-rows .atl-row')].map(r=>({c:r.querySelector('.atl-in-c').value.trim(),t:r.querySelector('.atl-in-t').value.replace(/\s+$/,'').replace(/^\s*\n/,''),s:r.querySelector('.atl-in-s').value||'',h:r.querySelector('.atl-in-h').value.trim(),d:r.querySelector('.atl-in-d').checked,w:parseInt(r.querySelector('.atl-in-w').value,10)||0})).filter(e=>e.c||e.t.trim());
  const l=all.filter(e=>!e.w).map(({w,...e})=>e);
  if(l.length)atlWk[k]=l;else delete atlWk[k];
  const keys=[k],moved=[];
  // Chantiers déplacés vers une autre semaine (même centre)
  all.filter(e=>e.w).forEach(({w,...e})=>{
    const m=atlParse(mk);m.setDate(m.getDate()+7*w);
    const kk=cid+'_'+atlYmd(m),ex=atlNorm(atlWk[kk]);
    ex.push(e);atlWk[kk]=ex;if(!keys.includes(kk))keys.push(kk);
    moved.push((e.c||'Chantier')+' → S'+wkNum(m));
  });
  let chg=false;
  l.forEach(e=>{if(e.c&&!atlChantiers.some(x=>x.toLowerCase()===e.c.toLowerCase())){atlChantiers.push(e.c);chg=true;}});
  if(chg){atlChantiers.sort((a,b)=>a.localeCompare(b,'fr'));atlSvCh();}
  atlSvCells(keys);
  atlClose();atlRender();
  toast(moved.length?`Déplacé : ${moved.join(', ')} ✓`:'Enregistré ✓');
};
window.atlClearDay=()=>{

};

window.atlCentreDel=()=>{

const pmbToday=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();};
function pmbDate(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(String(s||'').trim());if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1]);}
function pmbNorm(r,id){
  r=r||{};const st=atlList(r.st).map(x=>x?1:0);
  if(r.v!==2)st.unshift(0); // ancien format (10 colonnes) : on insère « En Préparation BE »
  while(st.length<PMB_N)st.push(0);
  const o={id:r.id||id,v:2,o:+r.o||0,st:st.slice(0,PMB_N),arch:!!r.arch,an:r.an||''};
  PMB_FIELDS.forEach(f=>o[f]=String(r[f]==null?'':r[f]));
  // arc = archivé (posé). Lignes reprises d'Excel : « Posé / Réalisé » dans Date POSE ou Commentaires → archivées
  o.arc=o.arch&&(r.arc!==undefined?!!r.arc:/pos[ée]|réalis/i.test(o.pose+' '+o.com));
  return o;
}

async function pmbUpd(o){
  pmbMaj=pmbToday();o['meta/maj']=pmbMaj;pmbSaveCache();ss('syncing');
  try{await update(ref(db,PB),o);ss('ok');}
  catch(e){ss('err');toast('Hors ligne : sauvegardé sur l\'appareil, sync au retour du réseau');}
}

onValue(ref(db,PB+'/meta'),s=>{
  const m=s.val()||{};
  if(m.maj)pmbMaj=m.maj;
  if(!m.seeded&&!pmbSeeding){ // 1re ouverture : on envoie le tableau Excel dans Firebase
    pmbSeeding=true;const o={'meta/seeded':true,'meta/maj':pmbMaj};
    PMB_SEED.forEach(r=>{o['rows/'+r.id]=r;});
    update(ref(db,PB),o).catch(()=>{pmbSeeding=false;});
  }
  pmbRefresh();
});

function pmbRefresh(){
  if(curTab!=='prod')return;
  // ne pas re-dessiner pendant une saisie (on perdrait le curseur)
  const a=document.activeElement;if(a&&a.closest&&a.closest('#pmb-table')){pmbPending=true;return;}
  pmbRender();
}

// Cellule date : affichage jj/mm/aaaa + calendrier natif au clic
function pmbISO(s){const d=pmbDate(s);return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';}
function pmbDateCell(r,f,cls,ph){return `<td class="${cls} w-dt" title="Cliquer pour choisir une date"><div class="pmb-dt" data-ph="${ph||''}">${esc(r[f])}</div><input type="date" class="pmb-dtin" value="${pmbISO(r[f])}" onclick="pmbPick(this)" onchange="pmbSetDate('${r.id}','${f}',this.value)" tabindex="-1"></td>`;}
function pmbPct(v){const n=parseFloat(String(v||'').replace(',','.').replace(/[^\d.]/g,''));return isNaN(n)?null:Math.max(0,Math.min(100,Math.round(n)));}
// Ligne sous-traitée : commentaire « Sous-traitante » (ou sous-traitance, sous traitant…) → ligne en marron très clair
const PMB_ST_TXT='Sous-traitante';
function pmbIsST(r){return /^\s*sous[\s-]*trait/i.test(r.com||'');}
// Machine : '', 'U', 'W' ou 'U+W' (accepte aussi « uw », « u + w »…)
function pmbUWn(v){v=String(v||'').toUpperCase().replace(/[\s+]/g,'');return v==='UW'||v==='WU'?'U+W':v==='U'||v==='W'?v:'';}

function pmbSorted(l){

  }

}

  if(a==='del'){if(!confirm(`Supprimer la ligne « ${r.ch||'sans nom'} » ?`))return;delete pmbRows[id];pmbSvRows([id]);}
  else{
    const sec=pmbAll().filter(x=>x.arch===r.arch&&x.arc===r.arc&&(!r.arch||String(x.an)===String(r.an)));
    const i=sec.findIndex(x=>x.id===id),j=i+(a==='up'?-1:1);if(j<0||j>=sec.length)return;
    const other=sec[j],t=r.o;r.o=other.o;other.o=t;pmbRows[id]=r;pmbRows[other.id]=other;pmbSvRows([id,other.id]);
  }
  pmbRender();
};

// ── MIGRATION : nettoyer les anciennes cellules (format ti_offset) ──
// Une seule fois : si des clés Firebase ne suivent pas le format ti_YYYY-MM-DD, on les efface.
setTimeout(async ()=>{
  try{
    const snap=await new Promise(res=>onValue(ref(db,CR),s=>res(s),{onlyOnce:true}));
    const data=snap.val();
    if(data){
      const isOldFormat=Object.keys(data).some(k=>!/_\d{4}-\d{2}-\d{2}$/.test(k));
      if(isOldFormat){
        await set(ref(db,CR),null);
        cells={};
        render();
        toast('Anciennes données réinitialisées (nouveau format de dates)');
      }
    }
  }catch(e){}
},800);
