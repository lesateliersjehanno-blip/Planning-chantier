<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg3:#ebebeb;--border:#e0e0e0;
  --text:#1a1a1a;--text2:#666;--text3:#999;--blue:#378ADD;
  --rs:6px;--shadow:0 2px 16px rgba(0,0,0,.12);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--border:#3a3a3c;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;}

/* ── HEADER ─────────────────────────────────────────────── */
header{background:var(--bg);border-bottom:.5px solid var(--border);padding:8px 12px;position:sticky;top:0;z-index:50;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.header-top h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;}
.sync-badge{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s;}
.sync-dot.ok{background:#4caf50;}.sync-dot.syncing{background:#ff9800;animation:pulse 1s infinite;}.sync-dot.err{background:#f44336;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;}
.btn{font-size:12px;padding:0 10px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;height:30px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex-shrink:0;}
.btn:active{background:var(--bg3);}.btn.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.nav-btn{width:30px;height:30px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-btn:active{background:var(--bg3);}
.sep{width:.5px;height:20px;background:var(--border);margin:0 2px;flex-shrink:0;}

/* ── PANEL ────────────────────────────────────────────────── */
.panel{display:none;padding:10px 12px 12px;background:var(--bg);border-bottom:.5px solid var(--border);}
.panel.open{display:flex;gap:16px;flex-wrap:wrap;}
.cal-wrap{min-width:200px;}
.cal-nav{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.cal-nav span{flex:1;text-align:center;font-size:12px;font-weight:600;}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9px;color:var(--text3);margin-bottom:3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cd{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;color:var(--text);position:relative;}
.cd:hover{background:var(--bg2);}.cd.om{color:var(--text3);}.cd.td{font-weight:700;color:var(--blue);}
.cd.ir{background:#EAF3FD;}.cd.rs{background:var(--blue);color:#fff;border-radius:4px 0 0 4px;}
.cd.re{background:var(--blue);color:#fff;border-radius:0 4px 4px 0;}.cd.rs.re{border-radius:4px;}
.cd.wk{color:#bbb;}.cd.wk.ir{background:#ebebeb;}
.cd.fe::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#f44336;}
.days-picker{display:flex;flex-direction:column;gap:7px;}
.days-picker label{font-size:11px;color:var(--text2);font-weight:500;}
.dp-presets{display:flex;gap:4px;flex-wrap:wrap;}
.dp-presets button{font-size:11px;padding:4px 9px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;}
.dp-presets button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.dp-custom{display:flex;align-items:center;gap:5px;}
.dp-custom input{width:55px;font-size:12px;padding:5px 7px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);color:var(--text);}

/* ── GESTION POLES ────────────────────────────────────────── */
.poles-bar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:.5px solid var(--border);background:var(--bg2);}
.pole-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;white-space:nowrap;user-select:none;transition:opacity .15s;flex-shrink:0;}
.pole-chip.off{opacity:.28;filter:grayscale(.5);}
.pole-chip:active{transform:scale(.95);}
.poles-actions{display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;}
#pole-chips{display:flex;gap:5px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;min-width:0;}
#pole-chips::-webkit-scrollbar{display:none;}

/* ── MOBILE : barre pôles masquée, header compact ───── */
@media(max-width:900px){
  .poles-bar{display:none!important;}
  header{padding:6px 8px;}
  .header-top h1{font-size:13px;}
  .toolbar{gap:3px;}
  .toolbar .btn{padding:0 7px;font-size:11px;height:28px;}
  .nav-btn{width:26px;height:26px;}
  #mlbl{min-width:60px!important;font-size:11px!important;}
  thead th.team-col{min-width:140px!important;width:140px!important;padding-left:6px!important;}
  .team-cell{min-width:140px!important;width:140px!important;max-width:140px!important;padding:4px 5px!important;}
  thead th.dn{width:64px!important;min-width:64px!important;max-width:64px!important;}
  .dc.dn{width:64px!important;min-width:64px!important;max-width:64px!important;}
  thead th.ds{width:20px!important;min-width:20px!important;max-width:20px!important;}
  .dc.ds{width:20px!important;min-width:20px!important;max-width:20px!important;}
  thead th.dw{width:46px!important;min-width:46px!important;max-width:46px!important;}
  .dc.dw{width:46px!important;min-width:46px!important;max-width:46px!important;}
  .cn{font-size:11px!important;}
  .cab{width:17px!important;height:17px!important;}
  .cc{font-size:9.5px!important;}
  .ct{font-size:8.5px!important;}
  .ci{min-height:54px!important;}
  .ci.ci-sav{min-height:115px!important;}
  .ct.ct-sav{min-height:55px!important;font-size:9px!important;}
  /* Sur mobile : header normal (scroll avec page), thead du tableau masqué (illisible une fois sticky cassé),
     remplacé par un en-tête dupliqué FIXE qui n'est pas un tableau (#mobile-hdr-wrap) */
  thead{display:none;}
  #mobile-hdr-wrap{display:block!important;position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;}
}
@media(min-width:901px){#mobile-hdr-wrap{display:none!important;}#bpf{display:none!important;}}

/* En-tête mobile dupliqué : structure en flex, pas un tableau */
#mobile-hdr-wrap{position:sticky;}
.mh-team-fixed{position:absolute;left:0;top:0;width:140px;height:40px;display:flex;align-items:center;padding-left:6px;font-size:10px;font-weight:600;color:var(--text2);background:var(--bg2);z-index:2;border-right:.5px solid var(--border);}
#mobile-hdr-scroll{display:flex;will-change:transform;padding-left:140px;}
.mh-day{flex:0 0 64px;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;text-align:center;height:40px;border-right:.5px solid var(--border);}
.mh-day.slim{flex:0 0 20px;width:20px;font-size:8px;}
.mh-day.wk{flex:0 0 46px;width:46px;background:#b8b8bd;color:#333;}
.mh-day.fe{background:#FFE8E8;}
.mh-day.today{background:#E8820C;color:#fff;font-weight:700;}

/* ── GANTT ────────────────────────────────────────────────── */
#gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media(min-width:901px){#gantt-wrap{overflow-y:auto;max-height:calc(100vh - 140px);isolation:isolate;}}
table{border-collapse:collapse;min-width:max-content;}
th,td{border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);}
thead th{background:var(--bg2);color:var(--text2);font-weight:500;font-size:11px;text-align:center;padding:4px 2px;white-space:nowrap;position:sticky;z-index:4;}
.tr-month th{top:0;}
.tr-week th{top:26px;}
thead th.week-cell{background:#e0e0e0!important;color:#888!important;font-size:9px!important;font-weight:400!important;padding:2px!important;}
@media(prefers-color-scheme:dark){thead th.week-cell{background:#3a3a3c!important;color:#999!important;}}
.tr-days th{top:44px;}
thead th.team-col{top:0!important;}
thead th.team-col{text-align:left;padding-left:8px;position:sticky;left:0;top:0;z-index:6;min-width:135px;width:135px;background:var(--bg2);}
thead th.month-hd{font-size:12px;font-weight:600;color:var(--text);background:var(--bg2);}
thead th.dn{width:110px;min-width:110px;}
thead th.ds{width:26px;min-width:26px;font-size:9px;padding:3px 1px;}
thead th.dw{width:72px;min-width:72px;}
thead th.wk{background:#b8b8bd!important;color:#333!important;}
thead th.fe{background:#FFE8E8!important;}
thead th.th{background:#E8820C!important;color:#fff!important;font-weight:700;}

.team-cell{position:sticky;left:0;background:var(--bg);z-index:2;width:135px;min-width:135px;max-width:135px;padding:5px 6px;vertical-align:top;border-left:3px solid transparent;}
.cr{display:flex;align-items:center;gap:3px;margin-bottom:1px;}
.cn{font-size:11px;font-weight:500;color:var(--text);padding:1px 3px;border-radius:3px;border:1px solid transparent;flex:1;line-height:1.3;cursor:text;min-width:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cn:focus{outline:none;border-color:var(--blue);background:var(--bg2);}
.cab{width:19px;height:19px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;flex-shrink:0;}
.cab:active{opacity:.7;}
.acb{font-size:10px;color:var(--text3);cursor:pointer;padding:1px 4px;border-radius:3px;display:inline-flex;align-items:center;gap:2px;margin-top:1px;}
.dcb{font-size:10px;color:var(--text3);cursor:pointer;flex-shrink:0;padding:2px;}
.dcb:active{color:#f44336;}
.dtb{display:inline-flex;align-items:center;gap:2px;font-size:9.5px;color:var(--text3);cursor:pointer;padding:1px 4px;border-radius:3px;margin-top:2px;opacity:0;transition:opacity .15s;}
.team-cell:hover .dtb{opacity:.8;}
.dtb:hover{color:#f44336;background:#FDECEA;opacity:1!important;}
@media(hover:none){.dtb{opacity:.55;}}
@media print{.dtb{display:none!important;}}
.shr{display:inline-flex;align-items:center;gap:2px;font-size:9.5px;color:var(--text3);cursor:pointer;padding:1px 4px;border-radius:3px;margin-top:2px;margin-right:2px;opacity:.7;}
.shr:hover{color:var(--blue);background:var(--bg2);opacity:1;}
@media print{.shr{display:none!important;}}

/* -- Poignee de deplacement d'equipe (appui long) -- */
.acb-wrap{position:relative;display:inline-flex;flex-shrink:0;}
.team-handle{position:absolute;top:100%;left:0;width:14px;height:11px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:9px;line-height:1;cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none;border-radius:3px;z-index:3;}
.team-handle:active{background:var(--bg3);cursor:grabbing;color:var(--blue);}
tr.row-moving{outline:2px dashed var(--blue);outline-offset:-2px;}
tr.row-moving .team-cell{background:rgba(55,138,221,.1);}
.move-toolbar{display:none;position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--blue);border:none;border-radius:22px;box-shadow:0 4px 20px rgba(55,138,221,.45);padding:6px 8px;gap:6px;z-index:600;align-items:center;}
.move-toolbar.open{display:flex;}
.move-toolbar .mt-label{font-size:11px;color:#fff;font-weight:600;padding:0 6px;white-space:nowrap;max-width:38vw;overflow:hidden;text-overflow:ellipsis;}
.move-toolbar button{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;}
.move-toolbar button:active{background:#fff;}
.move-toolbar button.done{background:#4caf50;color:#fff;}
.move-toolbar button:disabled{opacity:.35;cursor:default;}
@media print{.move-toolbar{display:none!important;}}

.dc{padding:2px;vertical-align:top;cursor:pointer;box-sizing:border-box;}
.dc.dn{width:110px;min-width:110px;max-width:110px;}
.dc.ds{width:26px;min-width:26px;max-width:26px;padding:1px;}
.dc.dw{width:72px;min-width:72px;max-width:72px;}
.dc.wk{background:#b8b8bd;}.dc.fe{background:#FFE8E8;}
.dc.tc{background:#FFF3CD;border-left:2px solid #E8820C;border-right:2px solid #E8820C;}
.ci.wknd-ci{align-items:center;justify-content:center;}
.wknd-disp{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:500;text-align:center;line-height:1.3;padding:5px 3px 4px;border-radius:5px;position:relative;}
.wknd-name{cursor:pointer;border-radius:3px;padding:0 3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wknd-name:active{background:rgba(255,255,255,.55);}
.wknd-swap{position:absolute;top:1px;right:2px;font-size:8px;opacity:.5;cursor:pointer;padding:2px;line-height:1;}
.wknd-swap:active{opacity:1;}
.wknd-row{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;}
.wknd-rm{font-size:10px;opacity:.65;cursor:pointer;line-height:1;padding:3px;}
.wknd-rm:active{opacity:1;color:#f44336;}
.wknd-add{font-size:9px;opacity:.55;cursor:pointer;padding:1px 4px;margin-top:1px;border-radius:3px;}
.wknd-add:active{opacity:1;background:rgba(255,255,255,.4);}
.dc:active{background:#e3f0fd!important;}
.ci{display:flex;flex-direction:column;gap:2px;min-height:60px;}
.ci[draggable="true"]{cursor:grab;}
.ci.dragging{opacity:0.35;}
.dc.drag-over .ci{outline:2px dashed #378ADD;outline-offset:-2px;border-radius:5px;background:rgba(55,138,221,.08);}
.cc{flex:0 0 30px;border-radius:4px;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:2px 4px;line-height:1.2;}
.ct{flex:1;min-height:26px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:2px 4px;line-height:1.2;border:.5px solid transparent;}
.ct.ct-sav{min-height:48px;white-space:normal;line-height:1.3;-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;}
.sc{font-size:0;border-radius:3px;}.sc.ct{border:.5px solid transparent;}

/* ── POPUPS ───────────────────────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;}
.overlay.open{display:block;}
.popup{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);border-radius:16px;padding:18px;z-index:200;width:min(320px,calc(100vw - 28px));box-shadow:var(--shadow);}
.popup.open{display:block;}
.popup h3{font-size:14px;font-weight:600;margin-bottom:13px;}
.popup label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px;}
.popup input[type=text],.popup textarea{width:100%;font-size:13px;padding:8px 10px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);color:var(--text);margin-bottom:11px;font-family:inherit;resize:none;}
.popup input[type=text]:focus,.popup textarea:focus{outline:none;border-color:var(--blue);}
.cp-btns{display:flex;gap:6px;margin-bottom:11px;}
.cpb{flex:1;font-size:11px;padding:7px;border-radius:6px;border:.5px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.pop-btns{display:flex;gap:7px;justify-content:flex-end;}
.pop-btns button{font-size:12px;padding:7px 13px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;}
.pop-btns .ok{background:var(--blue);color:#fff;border-color:var(--blue);}
.pop-btns .del{color:#f44336;border-color:#f44336;}

/* Popup ajout pôle */
.pole-editor{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);border-radius:16px;padding:18px;z-index:250;width:min(300px,calc(100vw - 28px));box-shadow:var(--shadow);}
.pole-editor.open{display:block;}
.pole-editor h3{font-size:14px;font-weight:600;margin-bottom:13px;}
.pole-editor input{width:100%;font-size:13px;padding:8px 10px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);color:var(--text);margin-bottom:10px;}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px;}
.color-opt{width:32px;height:32px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.color-opt.sel{border-color:var(--text);}
.pole-editor .pop-btns{display:flex;gap:7px;justify-content:flex-end;}

.act-popup{display:none;position:fixed;background:var(--bg);border-radius:12px;padding:7px;z-index:300;width:190px;max-height:min(75vh,420px);overflow-y:auto;box-shadow:var(--shadow);border:.5px solid var(--border);}
.act-popup.open{display:block;}
.ao{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text);}
.ao:active{background:var(--bg2);}
.adot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

.ctx-menu{display:none;position:fixed;background:var(--bg);border:.5px solid var(--border);border-radius:10px;padding:4px;z-index:350;min-width:155px;box-shadow:var(--shadow);}
.ctx-menu.open{display:block;}
.ctx-item{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:5px;font-size:12px;cursor:pointer;color:var(--text);}
.ctx-item:hover{background:var(--bg2);}
.ctx-item.dis{color:var(--text3);cursor:default;}.ctx-item.dis:hover{background:none;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 16px;border-radius:18px;font-size:12px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* ── IMPRESSION ───────────────────────────────────────────── */
#print-hdr{display:none;}
@media print{
  @page{size:A3 landscape;margin:6mm;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  header,.panel,.poles-bar,.overlay,.popup,.act-popup,.ctx-menu,.toast,.pole-editor{display:none!important;}
  #print-hdr{display:flex!important;align-items:baseline;gap:12px;padding:0 0 4mm;font-size:13px;font-weight:600;border-bottom:1px solid #ccc;margin-bottom:3mm;}
  #print-hdr span{font-size:10px;color:#666;font-weight:400;}
  body{font-size:9px;}
  #gantt-wrap{overflow:visible!important;max-height:none!important;}
  table{width:100%!important;min-width:unset!important;border-collapse:collapse!important;}
  /* Répéter l'en-tête en haut de chaque page imprimée */
  thead{display:table-header-group!important;}
  tbody{display:table-row-group!important;}
  tr{page-break-inside:avoid!important;}
  thead th{position:static!important;top:auto!important;}
  thead th.team-col{position:static!important;left:auto!important;min-width:80px!important;width:80px!important;}
  .team-cell{position:static!important;left:auto!important;min-width:80px!important;width:80px!important;max-width:80px!important;}
  thead th.dn,.dc.dn{width:55px!important;min-width:55px!important;max-width:55px!important;}
  thead th.ds,.dc.ds{width:16px!important;min-width:16px!important;max-width:16px!important;}
  .ci{min-height:44px!important;}
  .cc{flex:0 0 20px!important;font-size:7px!important;}
  .ct{font-size:6.5px!important;}
  .cn{font-size:8px!important;}
  .cab,.dcb,.acb{display:none!important;}
  /* Saut de page par pôle */
  .pole-break{page-break-before:always!important;break-before:page!important;}
  body.print-continuous .pole-break{page-break-before:auto!important;break-before:auto!important;}
  .pole-sep-row td{padding:3px 8px!important;font-size:9px!important;}
}

/* ══ ONGLETS POSE / ATELIER ══════════════════════════════════ */
.tabs{display:flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;flex-shrink:0;}
.tab{font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;}
.tab.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14);}
body.mode-atelier header .toolbar:not(#atl-toolbar),body.mode-atelier .poles-bar,body.mode-atelier #panel,body.mode-atelier #gantt-wrap,body.mode-atelier #mobile-hdr-wrap,body.mode-atelier #print-hdr,body.mode-atelier .move-toolbar{display:none!important;}
body:not(.mode-atelier) #atl-toolbar,body:not(.mode-atelier) #atl-filter,body:not(.mode-atelier) #atelier-view{display:none!important;}
@media(max-width:560px){.h1-txt{display:none;}.tab{padding:5px 7px;font-size:11px;}.tab i{display:none;}.tabs{overflow-x:auto;flex-shrink:1;min-width:0;scrollbar-width:none;}}

/* ══ PLANNING ATELIER (vue semaine) ══════════════════════════ */
.atl-lbl{font-size:12px;font-weight:600;min-width:96px;text-align:center;flex-shrink:0;}
#atl-filter{display:flex;align-items:center;gap:6px;margin-top:7px;}
.atl-flbl{font-size:11px;color:var(--text3);display:inline-flex;align-items:center;gap:3px;flex-shrink:0;}
#atl-chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
#atl-chips::-webkit-scrollbar{display:none;}
.atl-fchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid transparent;white-space:nowrap;user-select:none;flex-shrink:0;transition:opacity .15s;}
.atl-fchip.off{opacity:.3;filter:grayscale(.6);}
.atl-fchip.all{background:var(--bg2);color:var(--text2);border-color:var(--border);}
#atl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 122px);max-height:calc(100dvh - 122px);}
#atl-table{border-collapse:separate;border-spacing:0;min-width:max-content;}
#atl-table.one{width:100%;min-width:0;}
#atl-table th,#atl-table td{border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);}
#atl-table thead{display:table-header-group!important;}
#atl-table thead th{position:sticky;top:0;background:var(--bg2);z-index:4;color:var(--text);white-space:nowrap;height:32px;font-size:12px;font-weight:700;padding:4px 8px;}
#atl-table thead th span{font-weight:400;color:var(--text2);}
#atl-table th.cur{background:#E8820C;color:#fff;}
#atl-table th.cur span{color:#fff;}
#atl-table th.atl-corner{left:0;z-index:7;text-align:left;padding-left:10px;min-width:150px;width:150px;font-weight:600;color:var(--text2);}
.atl-centre{position:sticky;left:0;z-index:2;background:var(--bg);min-width:150px;width:150px;max-width:150px;padding:6px 8px;vertical-align:top;border-left:4px solid transparent;cursor:pointer;}
.atl-cname{font-size:12px;font-weight:600;padding:5px 7px;border-radius:5px;display:flex;align-items:flex-start;gap:5px;word-break:break-word;line-height:1.3;}
.atl-ccount{font-size:10px;color:var(--text3);margin-top:4px;padding-left:2px;}
.atl-cell{vertical-align:top;padding:5px;min-width:360px;width:360px;cursor:pointer;height:64px;}
#atl-table.one .atl-cell{width:auto;}
#atl-table.w2 .atl-cell,#atl-table.w4 .atl-cell{min-width:480px;width:480px;}
.atl-cell:hover{background:var(--bg2);}
.atl-cell.cur{background:rgba(232,130,12,.06);}
/* mini-tableau façon Excel : chantier | tâches | sortie d'atelier */
.atl-wt{display:grid;grid-template-columns:minmax(90px,30%) 1fr 58px minmax(96px,24%);border:.5px solid #9a9a9f;border-radius:4px;overflow:hidden;background:var(--bg);}
.atl-wt>div{padding:4px 6px;border-bottom:.5px solid #b8b8bd;font-size:11px;line-height:1.35;word-break:break-word;white-space:pre-wrap;}
.atl-wt>div:nth-last-child(-n+4){border-bottom:none;}
.atl-wt .h{border-right:.5px solid #b8b8bd;text-align:center;font-size:10px;color:var(--text2);white-space:normal;}
.atl-wt .h b{display:block;font-size:12px;color:var(--text);}
.atl-wt .h.done b{color:#2E7D32;}
.atl-drag{cursor:grab;}
.atl-drag:active{cursor:grabbing;}
body.atl-dragging .atl-cell{outline:1px dashed rgba(55,138,221,.35);outline-offset:-3px;}
.atl-cell.drop{background:rgba(55,138,221,.14)!important;outline:2px dashed #378ADD!important;outline-offset:-3px;}
.atl-spk{cursor:pointer;}
.atl-spk:hover{box-shadow:inset 0 0 0 1.5px #378ADD;}
.atl-spick{display:none;position:fixed;z-index:420;background:var(--bg);border:.5px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:10px;width:330px;}
.atl-spick.open{display:block;}
.atl-sp-h{font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.3;}
.atl-sp-h i{color:#378ADD;}
.atl-sp-h small{font-weight:400;color:var(--text2);}
.atl-sp-days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.atl-sp-days button{font-size:11px;padding:6px 4px;border-radius:7px;border:.5px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit;}
.atl-sp-days button b{display:block;font-size:13px;color:var(--text);}
.atl-sp-days button.on{background:#378ADD;border-color:#378ADD;color:#fff;}
.atl-sp-days button.on b{color:#fff;}
.atl-sp-days button.fe{background:#FFE8E8;}
.atl-sp-f{display:flex;justify-content:space-between;margin-top:8px;}
.atl-sp-f button{font-size:11px;padding:5px 10px;border-radius:6px;border:.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;}
@media print{.atl-spick{display:none!important;}}
.atl-tot{font-size:11px;color:var(--text2);text-align:right;padding:3px 4px 0;}
.atl-tot b{color:var(--text);}
.atl-wt .c{font-weight:700;border-right:.5px solid #b8b8bd;}
.atl-wt .t{border-right:.5px solid #b8b8bd;color:var(--text);}
.atl-wt .s{font-size:10px;color:var(--text2);white-space:normal;}
.atl-wt .s b{display:block;font-size:11px;color:var(--text);}
.atl-wt .done{background:#E8F5E9;color:#2E7D32;}
.atl-wt .t.done{text-decoration:line-through;opacity:.8;}
.atl-wt .s.done b{color:#2E7D32;}
.atl-add-hint{display:flex;justify-content:center;color:var(--text3);font-size:12px;opacity:0;padding-top:3px;}
.atl-cell:hover .atl-add-hint,.atl-cell.empty .atl-add-hint{opacity:.45;}
.atl-cell.empty{vertical-align:middle;}
.atl-empty td{padding:30px;text-align:center;color:var(--text2);}
/* popup semaine */
.popup.atl-pop{width:min(760px,calc(100vw - 24px));max-height:88vh;overflow-y:auto;z-index:260;}
.atl-pop h3{display:flex;align-items:center;gap:6px;}
.atl-pop-sub{font-size:11px;color:var(--text3);margin:-8px 0 12px;}
.atl-rhead,.atl-row{display:grid;grid-template-columns:10px 1.1fr 1.6fr 62px 120px 118px 48px 30px;gap:6px;}
.popup .atl-row .atl-in-h{text-align:center;}
.atl-dn{height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);cursor:pointer;}
.atl-dn input{width:20px;height:20px;accent-color:#2E7D32;cursor:pointer;margin:0;}
.atl-row.done .atl-in-c,.atl-row.done .atl-in-t{text-decoration:line-through;opacity:.6;}
.atl-row.done .atl-dn{background:#E8F5E9;border-color:#2E7D32;}
.atl-rhead span:nth-child(4),.atl-rhead span:nth-child(7){text-align:center;}
.popup .atl-row select{width:100%;height:34px;font-size:12px;padding:0 6px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;}
.popup .atl-row select:disabled{opacity:.45;}
.popup .atl-row select.moved{border-color:#E8820C;background:rgba(232,130,12,.12);font-weight:600;}
.atl-rhead{font-size:10px;color:var(--text3);margin-bottom:4px;}
.atl-row{align-items:start;margin-bottom:8px;}
.popup .atl-row input,.popup .atl-row textarea{margin-bottom:0;padding:7px 8px;font-size:13px;width:100%;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;}
.popup .atl-row textarea{resize:vertical;min-height:34px;field-sizing:content;}
.popup .atl-row input:focus,.popup .atl-row textarea:focus{outline:none;border-color:var(--blue);}
.atl-dot{width:10px;height:10px;border-radius:3px;background:var(--bg3);margin-top:12px;}
.atl-rm{width:30px;height:32px;border-radius:6px;border:.5px solid var(--border);background:var(--bg);color:#f44336;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.atl-addrow{width:100%;font-size:12px;padding:8px;border-radius:6px;border:1px dashed var(--blue);background:transparent;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;margin:4px 0 12px;font-family:inherit;}
.atl-rep{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:11px;color:var(--text2);flex-wrap:wrap;}
.atl-rep select{font-size:12px;padding:5px 6px;border-radius:6px;border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;}
.atl-ced-move{display:flex;gap:6px;margin-bottom:12px;}
.atl-ced-move .btn{flex:1;justify-content:center;}
#atl-ced{z-index:260;}
@media(max-width:900px){
  #atl-table th.atl-corner,.atl-centre{min-width:104px!important;width:104px!important;max-width:104px!important;}
  .atl-cell{min-width:290px;width:290px;}
  #atl-table.w2 .atl-cell,#atl-table.w4 .atl-cell{min-width:290px;width:290px;}
  .atl-wt{grid-template-columns:minmax(70px,30%) 1fr 46px minmax(72px,24%);}
  #atl-wrap{max-height:calc(100vh - 112px);max-height:calc(100dvh - 112px);}
}
@media(max-width:600px){
  .atl-rhead{display:none;}
  .atl-row{grid-template-columns:10px 1fr 30px;padding-bottom:8px;border-bottom:.5px solid var(--border);}
  .atl-row .atl-dot{grid-row:1;grid-column:1;}
  .atl-row .atl-in-c{grid-row:1;grid-column:2;}
  .atl-row .atl-rm{grid-row:1;grid-column:3;}
  .atl-row .atl-in-t{grid-row:2;grid-column:2;}
  .atl-row .atl-in-h{grid-row:3;grid-column:2;text-align:left!important;}
  .atl-row .atl-in-s{grid-row:4;grid-column:2;}
  .atl-row .atl-in-w{grid-row:5;grid-column:2;}
  .atl-row .atl-dn{grid-row:2;grid-column:3;}
}
#atl-print-hdr{display:none;}
@media print{
  body.mode-atelier #atl-print-hdr{display:flex!important;align-items:baseline;gap:12px;padding:0 0 4mm;font-size:13px;font-weight:600;border-bottom:1px solid #ccc;margin-bottom:3mm;}
  #atl-print-hdr span{font-size:10px;color:#666;font-weight:400;}
  #atl-wrap{overflow:visible!important;max-height:none!important;}
  #atl-table thead th{position:static!important;}
  .atl-centre,#atl-table th.atl-corner{position:static!important;min-width:90px!important;width:90px!important;max-width:90px!important;}
  .atl-cell{min-width:0!important;width:auto!important;height:40px!important;}
  .atl-add-hint,.atl-ccount{display:none!important;}
  .atl-wt>div{font-size:8px!important;padding:2px 4px!important;}
  .atl-pop,#atl-ced{display:none!important;}

/* ══ PROD MEX BOIS (suivi de fabrication) ════════════════════ */
body.mode-prod header .toolbar:not(#pmb-toolbar),body.mode-prod .poles-bar,body.mode-prod #panel,body.mode-prod #gantt-wrap,body.mode-prod #mobile-hdr-wrap,body.mode-prod #print-hdr,body.mode-prod .move-toolbar{display:none!important;}
body:not(.mode-prod) #pmb-toolbar,body:not(.mode-prod) #pmb-view{display:none!important;}
#pmb-toolbar{flex-wrap:nowrap;}
.pmb-search{height:30px;font-size:12px;padding:0 10px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--bg2);color:var(--text);width:180px;flex-shrink:0;font-family:inherit;}
.pmb-search:focus{outline:none;border-color:var(--blue);}
.pmb-maj{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;padding:0 4px;}
.pmb-maj b{color:var(--text);}
#pmb-chips{display:flex;gap:4px;flex-shrink:0;}
:is(#pmb-wrap,#ao-wrap){overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 88px);max-height:calc(100dvh - 88px);}
:is(#pmb-table,#ao-table){border-collapse:separate;border-spacing:0;min-width:max-content;font-size:12px;}

:is(#pmb-table,#ao-table) thead th.y{background:#FFF2CC;}
:is(#pmb-table,#ao-table) thead th.pmb-sth{width:62px;min-width:62px;max-width:62px;white-space:normal;text-align:center;font-size:10px;hyphens:auto;-webkit-hyphens:auto;padding:5px 1px;letter-spacing:-.2px;}
:is(#pmb-table,#ao-table) thead th.pmb-sth span{display:block;border-bottom:3px solid;padding-bottom:3px;}
:is(#pmb-table,#ao-table) .pmb-chh,:is(#pmb-table,#ao-table) td.pmb-ch{position:sticky;left:0;}
:is(#pmb-table,#ao-table) thead th.pmb-chh{z-index:6;background:#EFEFEF;text-align:left;}
:is(#pmb-table,#ao-table) td.pmb-ch{z-index:2;background:var(--bg);font-weight:600;}
:is(#pmb-table,#ao-table) td{vertical-align:top;padding:0;background:var(--bg);}
:is(#pmb-table,#ao-table) td.pmb-a{width:26px;min-width:26px;text-align:center;vertical-align:middle;}
.pmb-a button{width:22px;height:24px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:15px;border-radius:4px;line-height:1;}
.pmb-a button:hover{background:var(--bg2);color:var(--text);}
.pmb-in{min-height:28px;padding:6px 6px;line-height:1.3;outline:none;word-break:break-word;white-space:pre-wrap;cursor:text;}
.pmb-in:focus{background:#EAF3FD;box-shadow:inset 0 0 0 1.5px var(--blue);}
.pmb-in:empty::before{content:attr(data-ph);color:var(--text3);font-weight:400;}
td.w-com{width:130px;min-width:130px;max-width:130px;background:#F7F7F7!important;}
td.w-cond{width:92px;min-width:92px;max-width:92px;background:#F7F7F7!important;position:relative;}
td.w-cond .pmb-in{padding-right:20px;}
td.w-cond:hover .pmb-cbtn{opacity:1;background:var(--bg2);color:var(--text);}
td.w-pose{width:88px;min-width:88px;max-width:88px;}
td.w-pose.late .pmb-in{color:#d32f2f;font-weight:700;}
td.pmb-ch{width:190px;min-width:190px;max-width:190px;}
td.w-qte{width:62px;min-width:62px;max-width:62px;text-align:center;}
td.w-fin{width:90px;min-width:90px;max-width:90px;background:#EDEDED!important;}
td.w-t{width:66px;min-width:66px;max-width:66px;text-align:center;}
td.w-ral{width:170px;min-width:170px;max-width:170px;}
td.w-com{position:relative;}
td.w-com .pmb-in{padding-right:20px;}
.pmb-cbtn{position:absolute;top:4px;right:2px;width:17px;height:20px;border:none;border-radius:4px;background:transparent;color:var(--text3);cursor:pointer;font-size:10px;line-height:1;padding:0;opacity:.55;}
td.w-com:hover .pmb-cbtn,.pmb-cbtn:focus{opacity:1;background:var(--bg2);color:var(--text);}
:is(#pmb-table,#ao-table) tr.is-st td:not(.on):not(.pct){background:#EFE3D3!important;}
:is(#pmb-table,#ao-table) tr.is-st td.w-com .pmb-in{color:#6D4C41;font-weight:600;}
@media print{.pmb-cbtn{display:none!important;}:is(#pmb-table,#ao-table) tr.is-st td{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
td.w-uw{width:62px;min-width:62px;max-width:62px;text-align:center;vertical-align:middle!important;background:#F7F7F7!important;}
.pmb-uw{width:56px;height:24px;border:none;background:transparent;font:inherit;font-weight:700;text-align:center;text-align-last:center;cursor:pointer;color:var(--text);-webkit-appearance:none;appearance:none;padding:0;}
.pmb-uw.u{color:#1565C0;}.pmb-uw.w{color:#AD1457;}.pmb-uw.uw{color:#6A1B9A;}
.pmb-uw:focus{outline:1.5px solid var(--blue);border-radius:4px;}
td.w-dt{position:relative;cursor:pointer;}
td.w-dt .pmb-dt{min-height:28px;padding:6px 6px;line-height:1.3;white-space:pre-wrap;word-break:break-word;}
td.w-dt .pmb-dt:empty::before{content:attr(data-ph);color:var(--text3);font-weight:400;}
td.w-dt:hover .pmb-dt{background:#EAF3FD;}
td.w-dt input.pmb-dtin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;margin:0;font-size:16px;}
td.w-dt input.pmb-dtin::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer;}
td.w-fin.late .pmb-dt{color:#d32f2f;font-weight:700;}
td.w-pose.late .pmb-dt{color:#d32f2f;font-weight:700;}
td.w-pct{width:58px;min-width:58px;max-width:58px;text-align:center;vertical-align:middle!important;}
td.w-pct .pmb-in{font-weight:700;}
:is(#pmb-table,#ao-table) thead th.pmb-pcth{width:58px;min-width:58px;max-width:58px;text-align:center;font-size:10px;padding:5px 1px;white-space:normal;}
td.pmb-st.pct{color:#1a1a1a;font-size:10px;font-weight:600;}
td.pmb-st{width:62px;min-width:62px;max-width:62px;text-align:center;vertical-align:middle!important;cursor:pointer;font-weight:700;font-size:12px;color:#fff;user-select:none;}
td.pmb-st:hover{box-shadow:inset 0 0 0 2px var(--blue);}
td.pmb-st.on{opacity:.45;}
td.pmb-st.cur{opacity:1;}
td.pmb-st.last{background:#F0F0F0!important;}
:is(#pmb-table,#ao-table) tr.pmb-sec td{background:#C9DAF8;color:#1a1a1a;font-weight:700;font-size:12px;padding:7px 10px;cursor:default;}
:is(#pmb-table,#ao-table) tr.pmb-sec.arch td{cursor:pointer;background:#DCE6F5;}
:is(#pmb-table,#ao-table) tr.pmb-sec td .pmb-secin{position:sticky;left:10px;display:inline-flex;align-items:center;gap:6px;}
:is(#pmb-table,#ao-table) tr.pmb-yr td{background:#D9D9D9;font-weight:700;padding:4px 10px;font-size:11px;}
:is(#pmb-table,#ao-table) tr.pmb-yr td .pmb-secin{position:sticky;left:10px;}
:is(#pmb-table,#ao-table) tr.pmb-emp td{padding:14px;color:var(--text3);text-align:center;}
:is(#pmb-table,#ao-table) tr.is-arch td.pmb-st.on{opacity:.8;}
:is(#pmb-table,#ao-table) tbody tr:hover td.pmb-ch{background:var(--bg2);}
.pmb-menu{display:none;position:fixed;background:var(--bg);border:.5px solid var(--border);border-radius:10px;padding:4px;z-index:400;min-width:210px;box-shadow:var(--shadow);}
.pmb-menu.open{display:block;}
.pmb-menu div{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:5px;font-size:12px;cursor:pointer;color:var(--text);}
.pmb-menu div:hover{background:var(--bg2);}
.pmb-menu div.red{color:#f44336;}
.pmb-menu div.dis{color:var(--text3);cursor:default;}.pmb-menu div.dis:hover{background:none;}
.pmb-menu small{font-size:10px;}
.pmb-menu.dlg{min-width:220px;padding:6px;}
.pmb-menu .pmb-dlgt{font-size:11px;font-weight:700;color:var(--text2);padding:4px 8px 6px;cursor:default;}
.pmb-menu .pmb-dlgt:hover{background:none;}
.pmb-menu label.pmb-chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;font-size:13px;cursor:pointer;}
.pmb-menu label.pmb-chk:hover{background:var(--bg2);}
.pmb-menu label.pmb-chk input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}
.pmb-menu label.pmb-chk small{margin-left:auto;color:var(--text3);}
.pmb-menu .pmb-dlgb{justify-content:flex-end;padding:6px 4px 2px;cursor:default;}
.pmb-menu .pmb-dlgb:hover{background:none;}
.pmb-menu .pmb-dlgb button{font:inherit;font-size:12px;padding:6px 14px;border-radius:6px;border:none;background:var(--blue);color:#fff;cursor:pointer;}
:is(#pmb-table,#ao-table) td.pmb-a{width:48px;min-width:48px;white-space:nowrap;}
.pmb-a button.pmb-go{color:#fff;background:#2E7D32;width:18px;height:20px;font-size:11px;margin-left:1px;border-radius:4px;}
.pmb-a button.pmb-go:hover{background:#1B5E20;color:#fff;}
:is(#pmb-table,#ao-table) tr.pmb-sec.att td{cursor:pointer;background:#DCE6F5;}
:is(#pmb-table,#ao-table) tr.pmb-sec.arc td{cursor:pointer;background:#E0E0E0;color:#555;}
:is(#pmb-table,#ao-table) tr.is-arc td{opacity:.8;}

.pmb-sel{width:15px;height:15px;vertical-align:middle;accent-color:#d32f2f;cursor:pointer;margin:0 1px 0 0;}

.pmb-yrsel input{accent-color:#d32f2f;width:14px;height:14px;cursor:pointer;}
.pmb-selbar{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a1a1a;color:#fff;border-radius:24px;padding:6px 8px 6px 16px;gap:8px;align-items:center;z-index:450;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:12px;white-space:nowrap;}

@media(prefers-color-scheme:dark){td.w-com,td.w-cond{background:#26262a!important;}td.w-fin{background:#2e2e32!important;}:is(#pmb-table,#ao-table) tr.pmb-sec td,:is(#pmb-table,#ao-table) tr.pmb-yr td,:is(#pmb-table,#ao-table) thead th{color:#1a1a1a;}}

/* pincer pour zoomer est autorisé ; le double-tap ne zoome pas (il sert aux croix de Prod Mex Bois) */

/* iPhone : champs en 16 px pour éviter le zoom automatique quand on tape dedans */

  input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{font-size:16px!important;}

<body>

<header>
  <div class="header-top">
    <h1><i class="ti ti-calendar-week" style="font-size:16px"></i><span class="h1-txt">Planning Jehanno</span></h1>
    <div class="tabs" role="tablist">
      <button class="tab on" id="tab-pose" role="tab" onclick="setTab('pose')"><i class="ti ti-building-factory-2"></i> Pose MEN</button>
      <button class="tab" id="tab-posech" role="tab" onclick="setTab('posech')"><i class="ti ti-home-2"></i> Pose CH</button>
      <button class="tab" id="tab-atelier" role="tab" onclick="setTab('atelier')"><i class="ti ti-tools"></i> Atelier</button>
      <button class="tab" id="tab-prod" role="tab" onclick="setTab('prod')"><i class="ti ti-list-check"></i> Prod Mex Bois</button>
    </div>
    <div class="sync-badge"><div class="sync-dot" id="sd"></div><span id="sl">…</span></div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="goToday()"><i class="ti ti-calendar-event"></i> Aujourd'hui</button>
    <div class="sep"></div>
    <button class="btn on" id="b15" onclick="setRange(15)">15j</button>
    <button class="btn" id="b30" onclick="setRange(30)">30j</button>
    <button class="btn" id="bpd" onclick="togglePanel('days')"><i class="ti ti-clock"></i></button>
    <div class="sep"></div>
    <button class="nav-btn" onclick="shiftDays(-1)"><i class="ti ti-chevron-left"></i></button>
    <span id="mlbl" style="font-size:12px;font-weight:600;min-width:80px;text-align:center;cursor:pointer;flex-shrink:0" onclick="togglePanel('cal')"></span>
    <button class="nav-btn" onclick="shiftDays(1)"><i class="ti ti-chevron-right"></i></button>
    <button class="btn" id="bpc" onclick="togglePanel('cal')"><i class="ti ti-calendar"></i></button>
    <div class="sep"></div>
    <button class="btn" onclick="printPlanning()" title="Imprimer avec sauts de page par pôle"><i class="ti ti-printer"></i></button>
    <button class="btn" onclick="printPlanningContinu()" title="Imprimer en continu (sans sauts de page)"><i class="ti ti-file-text"></i></button>
    <button class="btn" id="bpf" onclick="togglePanel('filters')"><i class="ti ti-filter"></i></button>
    <div class="sep"></div>
    <button class="btn" onclick="exportBackup()" title="Sauvegarder les données sur cet appareil (fichier .json)"><i class="ti ti-device-floppy"></i></button>
    <button class="btn" onclick="document.getElementById('restoreFile').click()" title="Restaurer une sauvegarde depuis un fichier .json"><i class="ti ti-upload"></i></button>
    <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="importBackup(event)">
  </div>
  <!-- Barre d'outils ATELIER -->
  <div class="toolbar" id="atl-toolbar">
    <button class="btn" onclick="atlToday()"><i class="ti ti-calendar-event"></i> Aujourd'hui</button>
    <div class="sep"></div>
    <button class="nav-btn" onclick="atlShift(-1)" title="Semaine précédente"><i class="ti ti-chevron-left"></i></button>
    <span id="atl-lbl" class="atl-lbl"></span>
    <button class="nav-btn" onclick="atlShift(1)" title="Semaine suivante"><i class="ti ti-chevron-right"></i></button>
    <div class="sep"></div>
    <button class="btn" data-w="1" onclick="atlSetWeeks(1)">1 sem</button>
    <button class="btn" data-w="2" onclick="atlSetWeeks(2)">2 sem</button>
    <button class="btn" data-w="4" onclick="atlSetWeeks(4)">4 sem</button>
    <button class="btn" data-w="6" onclick="atlSetWeeks(6)">6 sem</button>
    <div class="sep"></div>
    <button class="btn" onclick="atlCentreOpen(null)"><i class="ti ti-plus"></i> Centre</button>
    <button class="btn" onclick="atlPrint()" title="Imprimer le planning atelier"><i class="ti ti-printer"></i></button>
  </div>
  <!-- Filtre des centres (afficher / masquer) -->
  <div id="atl-filter"><span class="atl-flbl"><i class="ti ti-filter"></i> Centres</span><div id="atl-chips"></div></div>
  <!-- Barre d'outils PROD MEX BOIS -->
  <div class="toolbar" id="pmb-toolbar">
    <input type="search" class="pmb-search" id="pmb-q" placeholder="Rechercher un chantier…" oninput="pmbSearch(this.value)">
    <div class="sep"></div>
    <div id="pmb-chips"></div>
    <div class="sep"></div>
    <div id="pmb-uwchips" style="display:flex;gap:4px;flex-shrink:0;"></div>
    <div class="sep"></div>
    <button class="btn" onclick="pmbAdd()"><i class="ti ti-plus"></i> Ligne</button>

}

  teams.forEach(t=>{ if(!t.id){ t.id='tm_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); changed=true; } });
  return changed;
}
function weekendKey(teamId,d){return teamId+'_'+dateKey(d);}
function teamsInSamePole(poleId){return teams.filter(t=>domAct(t)===poleId);}
function getWeekendAssign(team,d){const k=weekendKey(team.id,d);return weekendAssign[k]||team.id;}
function getWeekendNames(team,d,assignedTeam){
  const k=weekendKey(team.id,d);
  const ov=weekendNames[k];
  if(ov&&Array.isArray(ov))return ov.map(v=>v!=null?v:'');
  return (assignedTeam.compagnons&&assignedTeam.compagnons.length)?assignedTeam.compagnons.map(c=>c.name):[assignedTeam.name];
}
function teamNamesLabel(t){if(t&&t.compagnons&&t.compagnons.length)return t.compagnons.map(c=>c.name).join(', ');return (t&&t.name)||'Équipe';}
function compagnonsInPole(poleId){
  const list=[];
  teams.forEach((t,ti)=>{t.compagnons.forEach((c,ci)=>{if(c.actId===poleId)list.push({name:c.name,ti,ci});});});
  return list;
}

function buildColumns(){
  const cols=[];let d=0;
  while(d<nbDays){
    if(isWk(d)){
      const dow=DD(d).getDay();
      if(dow===6&&d+1<nbDays&&isWk(d+1)){cols.push({type:'weekend',days:[d,d+1]});d+=2;}
      else{cols.push({type:'weekend',days:[d]});d+=1;}
    } else {cols.push({type:'day',days:[d]});d+=1;}
  }
  return cols;
}
function mHdr(cols){let r=[],c=null;cols.forEach(col=>{const x=DD(col.days[0]),m=x.toLocaleString('fr-FR',{month:'long',year:'numeric'});if(!c||c.n!==m){c={n:m,k:1};r.push(c);}else c.k++;});return r;}
function wHdr(cols){let r=[],c=null;cols.forEach(col=>{const w=wkNum(DD(col.days[0]));if(!c||c.w!==w){c={w,k:1};r.push(c);}else c.k++;});return r;}
function updLbl(){document.getElementById('mlbl').textContent=startDate.toLocaleString('fr-FR',{month:'long',year:'numeric'}).replace(/^\w/,c=>c.toUpperCase());}

// Conserve le défilement (page + tableaux) quand une modif arrive d'un autre utilisateur
function keepScroll(fn){
  const w=[window.scrollX,window.scrollY],el=['gantt-wrap','atl-wrap','pmb-wrap','ao-wrap'].map(id=>{const e=document.getElementById(id);return e?[e,e.scrollLeft,e.scrollTop]:null;}).filter(Boolean);
  const wraps=el.map(([e])=>{const h=e.offsetHeight;e.style.minHeight=h?h+'px':'';return e;});
  try{fn();}finally{
    el.forEach(([e,l,t])=>{e.scrollLeft=l;e.scrollTop=t;});window.scrollTo(w[0],w[1]);
    requestAnimationFrame(()=>{wraps.forEach(e=>e.style.minHeight='');el.forEach(([e,l,t])=>{e.scrollLeft=l;e.scrollTop=t;});window.scrollTo(w[0],w[1]);});
  }
}

function poseApply(m){const S=PST[m];if(S.teams)teams=S.teams;cells=S.cells||{};if(S.poles)POLES=S.poles;weekendAssign=S.weekend||{};weekendNames=S.names||{};}
['men','ch'].forEach(m=>{
  const b=PBASE[m],S=PST[m],on=()=>poseMode===m;
  onValue(ref(db,b+'/teams'),s=>{const d=s.val();if(d&&Array.isArray(d)){S.teams=d;if(on()){teams=d;if(ensureTeamIds())svT();if(curTab==='pose'||curTab==='posech')keepScroll(()=>{render();buildChips();});saveCache();}}if(m==='men')ss('ok');},()=>{if(m==='men')ss('err');});
  onValue(ref(db,b+'/cells'),s=>{S.cells=s.val()||{};if(on()){cells=S.cells;keepScroll(render);saveCache();}});
  onValue(ref(db,b+'/poles'),s=>{const d=s.val();if(d&&Array.isArray(d)){S.poles=d;if(on()){POLES=d;keepScroll(()=>{buildChips();render();});saveCache();}}});
  onValue(ref(db,b+'/weekend'),s=>{S.weekend=s.val()||{};if(on()){weekendAssign=S.weekend;keepScroll(render);saveCache();}});
  onValue(ref(db,b+'/weekendNames'),s=>{S.names=s.val()||{};if(on()){weekendNames=S.names;keepScroll(render);saveCache();}});
});

// ── CALENDRIER ────────────────────────────────────────────────
function renderCal(){
  const yr=calViewDate.getFullYear(),mo=calViewDate.getMonth();
  document.getElementById('cpl').textContent=new Date(yr,mo,1).toLocaleString('fr-FR',{month:'long',year:'numeric'}).replace(/^\w/,c=>c.toUpperCase());
  document.getElementById('chdr').innerHTML=['Lu','Ma','Me','Je','Ve','Sa','Di'].map(d=>`<div>${d}</div>`).join('');
  const g=document.getElementById('cgrid');g.innerHTML='';
  const fd=new Date(yr,mo,1);let sd=fd.getDay()||7;
  const ld=new Date(yr,mo+1,0).getDate(),rS=startDate.getTime();
  const rE=new Date(startDate);rE.setDate(rE.getDate()+nbDays-1);rE.setHours(23,59,59);
  const tm=tMs(),pl=new Date(yr,mo,0).getDate();
  for(let i=sd-1;i>0;i--){const d=new Date(yr,mo-1,pl-i+1);d.setHours(0,0,0,0);g.appendChild(calEl(d,true,rS,rE.getTime(),tm));}
  for(let i=1;i<=ld;i++){const d=new Date(yr,mo,i);d.setHours(0,0,0,0);g.appendChild(calEl(d,false,rS,rE.getTime(),tm));}
  const tot=(sd-1)+ld,nx=tot%7===0?0:7-(tot%7);
  for(let i=1;i<=nx;i++){const d=new Date(yr,mo+1,i);d.setHours(0,0,0,0);g.appendChild(calEl(d,true,rS,rE.getTime(),tm));}
}
function calEl(date,other,rS,rE,tm){
  const el=document.createElement('div'),dMs=date.getTime(),dw=date.getDay(),wk=dw===0||dw===6,fe=isFerie(date);
  let cls='cd';
  if(other)cls+=' om';if(dMs===tm)cls+=' td';if(wk)cls+=' wk';if(fe&&!other)cls+=' fe';
  if(dMs>=rS&&dMs<=rE)cls+=wk?' wk ir':' ir';
  if(dMs===rS)cls+=' rs';if(dMs===rE)cls+=' re';
  el.className=cls;el.textContent=date.getDate();
  el.onclick=()=>{startDate=new Date(date);startDate.setHours(0,0,0,0);updLbl();renderCal();render();svR();};
  return el;
}

function buildChipsInto(el){
  el.innerHTML='';
  const allOn=activeFilters.size===0;
  const all=document.createElement('div');
  all.className='pole-chip'+(allOn?'':' off');
  all.style.cssText='background:#F1EFE8;color:#444;border-color:#D3D1C7';
  all.innerHTML='<i class="ti ti-layout-grid" style="font-size:12px"></i> Tous';
  all.onclick=()=>{activeFilters.clear();saveFilterPrefs();buildChips();render();};
  el.appendChild(all);
  POLES.forEach(p=>{
    const on=activeFilters.has(p.id);
    const wrap=document.createElement('div');
    wrap.style.cssText='display:inline-flex;align-items:center;gap:1px;';
    const chip=document.createElement('div');
    chip.className='pole-chip'+(activeFilters.size>0&&!on?' off':'');
    chip.style.cssText=`background:${p.bg};color:${p.text};border-color:${p.bg};border-radius:16px 0 0 16px;padding-right:6px`;
    chip.innerHTML=`<i class="ti ${p.icon||'ti-circle'}" style="font-size:12px"></i> ${p.label}`;
    chip.onclick=()=>{if(on)activeFilters.delete(p.id);else activeFilters.add(p.id);if(activeFilters.size===POLES.length)activeFilters.clear();saveFilterPrefs();buildChips();render();};
    const editBtn=document.createElement('button');
    editBtn.style.cssText=`background:${p.bg};color:${p.text};border:1.5px solid ${p.bg};border-left:.5px solid rgba(0,0,0,.1);border-radius:0 16px 16px 0;padding:4px 7px;cursor:pointer;font-size:11px;height:28px;display:flex;align-items:center;opacity:${activeFilters.size>0&&!on?'0.28':'1'}`;
    editBtn.innerHTML='<i class="ti ti-pencil" style="font-size:11px"></i>';
    editBtn.title='Modifier / Supprimer ce pôle';
    editBtn.onclick=(e)=>{e.stopPropagation();openPoleEditor(p.id);};
    wrap.appendChild(chip);
    wrap.appendChild(editBtn);
    el.appendChild(wrap);
  });
}
function buildChips(){
  buildChipsInto(document.getElementById('pole-chips'));
  const mobileEl=document.getElementById('pole-chips-mobile');
  if(mobileEl)buildChipsInto(mobileEl);
}

const PICONS=['ti-building-factory-2','ti-home-2','ti-tools','ti-dots','ti-truck','ti-bolt','ti-droplet','ti-tree','ti-star','ti-hammer','ti-ruler','ti-palette'];
window.openPoleEditor=function(id=null){
  editingPoleId=id;
  const ped=document.getElementById('ped');
  document.getElementById('ped-title').textContent=id?'Modifier le pôle':'Nouveau pôle';
  document.getElementById('ped-del').style.display=id&&POLES.length>1?'':'none';
  if(id){
    const p=poleById(id);
    document.getElementById('ped-name').value=p.label;
    selectedColorIdx=PALETTE.findIndex(c=>c.bg===p.bg);
    if(selectedColorIdx<0)selectedColorIdx=0;
  } else {
    document.getElementById('ped-name').value='';
    selectedColorIdx=POLES.length%PALETTE.length;
  }
  buildColorGrid();
  ped.classList.add('open');
  document.getElementById('ov').classList.add('open');
  setTimeout(()=>document.getElementById('ped-name').focus(),100);
};
function buildColorGrid(){
  const g=document.getElementById('color-grid');g.innerHTML='';
  PALETTE.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='color-opt'+(i===selectedColorIdx?' sel':'');
    d.style.background=c.bg;
    d.onclick=()=>{selectedColorIdx=i;buildColorGrid();};
    g.appendChild(d);
  });
}
window.savePole=function(){
  const name=document.getElementById('ped-name').value.trim();
  if(!name){toast('Nom requis');return;}
  const col=PALETTE[selectedColorIdx];
  if(editingPoleId){
    const p=POLES.find(x=>x.id===editingPoleId);
    if(p){p.label=name;p.bg=col.bg;p.text=col.text;p.tBg=col.tBg;}
  } else {
    const newId='pole_'+Date.now();
    POLES.push({id:newId,label:name,icon:'ti-circle',bg:col.bg,text:col.text,tBg:col.tBg});
  }
  closePoleEditor();buildChips();render();svP();
};
window.deletePole=function(){
  if(!editingPoleId||POLES.length<=1)return;
  if(!confirm('Supprimer ce pôle ?'))return;
  POLES=POLES.filter(p=>p.id!==editingPoleId);
  // Réassigner les compagnons de ce pôle vers "autre" ou le premier pôle restant
  const fallback=POLES[0].id;
  teams.forEach(t=>t.compagnons.forEach(c=>{if(c.actId===editingPoleId)c.actId=fallback;}));
  activeFilters.delete(editingPoleId);
  closePoleEditor();buildChips();render();svP();svT();
};
window.closePoleEditor=function(){document.getElementById('ped').classList.remove('open');document.getElementById('ov').classList.remove('open');editingPoleId=null;};

function letterColor(str){
  if(!str)return null;
  const first=str.trim()[0];
  if(!first)return null;
  // Chiffre 0-9
  const digit=parseInt(first);
  if(!isNaN(digit))return DCOLORS[digit];
  // Lettre A-Z
  const code=first.toUpperCase().charCodeAt(0);
  if(code>=65&&code<=90)return LCOLORS[code-65];
  return null;
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  const g=document.getElementById('gantt'),cols=buildColumns(),mh=mHdr(cols),wh=wHdr(cols);
  renderCols=cols;
  const colCount=cols.length;
  let h='<thead><tr class="tr-month"><th class="team-col" rowspan="3" style="vertical-align:bottom;padding-bottom:7px">Équipes</th>';
  mh.forEach(m=>{h+=`<th colspan="${m.k}" class="month-hd">${m.n}</th>`;});
  h+='</tr><tr class="tr-week">';
  wh.forEach(w=>{h+=`<th colspan="${w.k}" class="week-cell">S${w.w}</th>`;});
  h+='</tr><tr class="tr-days">';
  cols.forEach(col=>{
    if(col.type==='weekend'){
      const feG=col.days.some(isFO),tdG=col.days.some(isToday);
      let cls='dw wk'+(feG?' fe':'')+(tdG?' th':'');
      h+=`<th class="${cls}"${tdG?' style="font-weight:700"':''}>Équipe</th>`;
    } else {
      const d=col.days[0],sl=isSlim(d),fe=isFO(d),wk=isWk(d),td=isToday(d);
      let cls=(sl?'ds':'dn')+(fe?' fe':wk?' wk':'')+(td?' th':'');
      h+=`<th class="${cls}"${td?' style="font-weight:700"':''}>${fmtD(d)}</th>`;
    }
  });
  h+='</tr></thead><tbody>';

  let indexed=teams.map((team,ti)=>({team,ti}));
  let visible=indexed.filter(({team})=>activeFilters.size===0||activeFilters.has(domAct(team)));
  if(sortByPole)visible=[...visible].sort((a,b)=>{
    const la=poleById(domAct(a.team)).label.toLowerCase();
    const lb=poleById(domAct(b.team)).label.toLowerCase();
    return la.localeCompare(lb,'fr');
  });

  let lastPole=null,firstPole=true;
  visible.forEach(({team,ti})=>{
    const pid=domAct(team),pole=poleById(pid);
    if(sortByPole&&pid!==lastPole){
      // Séparateur — class pole-break pour saut de page impression (sauf le 1er)
      const breakCls=(!firstPole)?'pole-break':'';
      h+=`<tr class="pole-sep-row ${breakCls}"><td colspan="${colCount+1}" style="padding:0;background:${pole.bg};-webkit-print-color-adjust:exact;print-color-adjust:exact">
        <div style="position:sticky;left:0;display:inline-flex;align-items:center;padding:5px 10px;color:${pole.text};font-size:11px;font-weight:600;white-space:nowrap;z-index:3">
          <i class="ti ${pole.icon||'ti-circle'}" style="font-size:12px;margin-right:5px"></i>${pole.label.toUpperCase()}
        </div>
      </td></tr>`;
      lastPole=pid;firstPole=false;
    }
    h+=teamRow(team,ti,pole);
  });
  if(visible.length===0)h+=`<tr><td colspan="${colCount+1}" style="text-align:center;padding:28px;color:var(--text3)">Aucune équipe</td></tr>`;
  h+='</tbody>';
  g.innerHTML=h;

  // Events
  document.querySelectorAll('.dc').forEach(td=>{
    if(td.classList.contains('wknd-cell'))return;
    const ti=parseInt(td.dataset.ti),d=parseInt(td.dataset.d);
    // clic droit (souris) = menu ; au doigt : plus d'appui long, on ignore le « clic droit » tactile
    td.addEventListener('contextmenu',e=>{if(Date.now()-lastTouchT<1500){e.preventDefault();return;}openCtx(e,ti,d);});
    td.addEventListener('touchstart',()=>{lastTouchT=Date.now();},{passive:true});
    td.addEventListener('touchend',e=>{
      clearTimeout(lpt);
      // double-tap au doigt = ouvrir la case (comme le double-clic à la souris)
      const now=Date.now(),t=e.changedTouches&&e.changedTouches[0],k=ti+'_'+d;
      if(t&&lastTap.k===k&&now-lastTap.t<400&&Math.abs(t.clientX-lastTap.x)<30&&Math.abs(t.clientY-lastTap.y)<30){
        lastTap={k:'',t:0,x:0,y:0};tapOpened=now;
        if(e.cancelable)e.preventDefault();
        if(justDragged){justDragged=false;return;}
        openCPDirect(ti,d);
      }else if(t)lastTap={k,t:now,x:t.clientX,y:t.clientY};
    });
    td.addEventListener('touchmove',()=>{clearTimeout(lpt);lastTap={k:'',t:0,x:0,y:0};});
  });
  document.querySelectorAll('.team-handle').forEach(hd=>{
    const ti=parseInt(hd.dataset.ti);
    let handleTimer=null;
    const start=()=>{handleTimer=setTimeout(()=>{startMove(ti);},550);};
    const cancel=()=>{clearTimeout(handleTimer);};
    hd.addEventListener('touchstart',start,{passive:true});
    hd.addEventListener('touchend',cancel);
    hd.addEventListener('touchmove',cancel);
    hd.addEventListener('mousedown',e=>{e.preventDefault();start();});
    hd.addEventListener('mouseup',cancel);
    hd.addEventListener('mouseleave',cancel);
  });
  renderMobileHeader();
  if(movingTi!==null)refreshMoveUI();
}

function syncMobileHeaderScroll(){

// Suppression d'une équipe : les cases sont rangées par N° de ligne (« 3_2026-09-25 »),
// donc on décale d'un cran toutes les équipes du dessous pour qu'elles gardent leurs chantiers.
function removeTeam(ti){
  const deadId=teams[ti]&&teams[ti].id,moved={};
  Object.keys(cells).forEach(k=>{
    const m=/^(\d+)_(.+)$/.exec(k);if(!m)return;const j=+m[1];
    if(j===ti)delete cells[k];
    else if(j>ti){moved[(j-1)+'_'+m[2]]=cells[k];delete cells[k];}
  });
  Object.assign(cells,moved);
  teams.splice(ti,1);
  if(deadId){
    let touched=false,touchedN=false;
    Object.keys(weekendAssign).forEach(k=>{
      if(k.startsWith(deadId+'_')||weekendAssign[k]===deadId){delete weekendAssign[k];touched=true;}
    });
    Object.keys(weekendNames).forEach(k=>{
      if(k.startsWith(deadId+'_')){delete weekendNames[k];touchedN=true;}
    });
    if(touched)svW();
    if(touchedN)svN();
  }
  if(typeof endMove==='function')endMove();
  svC();svT();render();buildChips();
  toast('Équipe supprimée');
}
function teamHasCells(ti){return Object.keys(cells).some(k=>k.startsWith(ti+'_'));}
window.delTeam=ti=>{
  const t=teams[ti];if(!t)return;
  const nb=Object.keys(cells).filter(k=>k.startsWith(ti+'_')).length;
  if(!confirm(`Supprimer l'équipe « ${teamNamesLabel(t)} »${nb?` et ses ${nb} case${nb>1?'s':''} de planning`:''} ?\n\nLes autres équipes gardent leurs chantiers.`))return;
  removeTeam(ti);
};
window.delC=(ti,ci)=>{
  const t=teams[ti];if(!t)return;
  if(t.compagnons.length<=1){ // dernier compagnon = suppression de l'équipe → on demande confirmation
    return delTeam(ti);
  }
  t.compagnons.splice(ci,1);
  render();buildChips();svT();
};

function positionPopup(pop,rect){
  const pw=pop.offsetWidth||190,ph=pop.offsetHeight||160;
  let x=rect.left,y=rect.bottom+4;
  if(x+pw>window.innerWidth-8)x=window.innerWidth-pw-8;
  if(x<8)x=8;
  if(y+ph>window.innerHeight-8)y=rect.top-ph-4;
  if(y<8)y=8;
  if(y+ph>window.innerHeight-8)y=Math.max(8,window.innerHeight-ph-8);
  pop.style.left=x+'px';pop.style.top=y+'px';
}

window.dragOver=(e)=>{
  e.preventDefault();
  const td=e.currentTarget.closest('.dc');
  if(td)td.classList.add('drag-over');
};
window.dragLeave=(e)=>{
  const td=e.currentTarget.closest('.dc');
  if(td)td.classList.remove('drag-over');
};
window.dropCell=(e,ti,d)=>{
  e.preventDefault();
  const td=e.currentTarget.closest('.dc');
  if(td)td.classList.remove('drag-over');
  document.querySelectorAll('.ci.dragging').forEach(el=>el.classList.remove('dragging'));
  if(!dragSourceKey)return;
  const targetKey=K(ti,d);
  if(dragSourceKey===targetKey){dragSourceKey=null;return;}
  const srcData=cells[dragSourceKey];
  if(!srcData){dragSourceKey=null;return;}
  const destData=cells[targetKey];
  if(destData){
    if(!confirm(`Remplacer "${destData.chantier}" par "${srcData.chantier}" ?`)){dragSourceKey=null;return;}
  }
  cells[targetKey]={...srcData};
  delete cells[dragSourceKey];
  dragSourceKey=null;
  justDragged=true;
  render();svC();
  toast('📦 Chantier déplacé');
};

// -- REORDONNER LES EQUIPES (appui long sur la poignee) --------
function currentVisibleList(){
  let indexed=teams.map((team,ti)=>({team,ti}));
  let visible=indexed.filter(({team})=>activeFilters.size===0||activeFilters.has(domAct(team)));
  if(sortByPole)visible=[...visible].sort((a,b)=>{
    const la=poleById(domAct(a.team)).label.toLowerCase();
    const lb=poleById(domAct(b.team)).label.toLowerCase();
    return la.localeCompare(lb,'fr');
  });
  return visible;
}
function positionMoveToolbar(){
  const bar=document.getElementById('moveToolbar'),hdr=document.querySelector('header');
  if(!bar||!hdr)return;
  bar.style.top=(hdr.getBoundingClientRect().bottom+8)+'px';
}
function refreshMoveUI(){
  document.querySelectorAll('tr.row-moving').forEach(r=>r.classList.remove('row-moving'));
  const bar=document.getElementById('moveToolbar');
  if(movingTi===null||!teams[movingTi]){bar.classList.remove('open');return;}
  bar.classList.add('open');
  positionMoveToolbar();
  const tr=document.querySelector(`tr[data-ti="${movingTi}"]`);
  if(tr)tr.classList.add('row-moving');
  const lbl=document.getElementById('mtLabel');
  if(lbl)lbl.textContent=teams[movingTi].name||'Equipe';
  const visible=currentVisibleList();
  const pos=visible.findIndex(v=>v.ti===movingTi);
  document.getElementById('mtUp').disabled=(pos<=0);
  document.getElementById('mtDown').disabled=(pos<0||pos>=visible.length-1);
}
window.addEventListener('resize',()=>{if(movingTi!==null)positionMoveToolbar();});
window.startMove=function(ti){
  movingTi=ti;
  refreshMoveUI();
  if(document.querySelector(`tr[data-ti="${ti}"]`))document.querySelector(`tr[data-ti="${ti}"]`).scrollIntoView({behavior:'smooth',block:'nearest'});
  if(navigator.vibrate)navigator.vibrate(15);
};
function swapCellsForIndices(a,b){
  const pa=a+'_',pb=b+'_';
  const dataA={},dataB={};
  Object.keys(cells).forEach(k=>{
    if(k.startsWith(pa)){dataA[k.slice(pa.length)]=cells[k];delete cells[k];}
    else if(k.startsWith(pb)){dataB[k.slice(pb.length)]=cells[k];delete cells[k];}
  });
  Object.keys(dataA).forEach(suf=>{cells[pb+suf]=dataA[suf];});
  Object.keys(dataB).forEach(suf=>{cells[pa+suf]=dataB[suf];});
}
window.moveTeam=function(dir){
  if(movingTi===null)return;
  const visible=currentVisibleList();
  const pos=visible.findIndex(v=>v.ti===movingTi);
  const newPos=pos+dir;
  if(pos<0||newPos<0||newPos>=visible.length)return;
  const otherTi=visible[newPos].ti;
  swapCellsForIndices(movingTi,otherTi);
  [teams[movingTi],teams[otherTi]]=[teams[otherTi],teams[movingTi]];
  movingTi=otherTi;
  render();
  svT();
  svC();
};
window.endMove=function(){
  movingTi=null;
  document.querySelectorAll('tr.row-moving').forEach(r=>r.classList.remove('row-moving'));
  const bar=document.getElementById('moveToolbar');
  if(bar)bar.classList.remove('open');
};
document.addEventListener('click',e=>{
  if(movingTi===null)return;
  if(e.target.closest('#moveToolbar')||e.target.closest('.team-handle'))return;
  endMove();
});

function toast(msg){const t=document.getElementById('tst');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
